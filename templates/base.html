<!DOCTYPE html>
<html lang="en">

<head>
    {% block title %}Succesfully-Registered{% endblock %}
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }

        header {
            background: #333;
            color: white;
            padding: 10px;
        }

        footer {
            background: yellow;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>Flask Registeration</h1>
    {% with messages = get_flashed_messages(with_categories=True)%}
    {%if messages%}
    {% for category.msg in messages}
    <p style = "color:green">{{msg}}</p>
    {% endfor %}

{% endif %}
{% endwith %}

{% block content %} {% endblock %}
</body>

</html>
